apiVersion: v1
kind: ConfigMap
metadata:
  name: zigbee2mqtt-settings
  namespace: {{ .Release.Namespace }}
data:
  configuration.yaml: |
    advanced:
      homeassistant_discovery_topic: homeassistant
      homeassistant_status_topic: homeassistant/status
      last_seen: ISO_8601
      log_level: info
      log_output:
      - console
      network_key: GENERATE
    experimental:
      new_api: true
    frontend:
      port: 8080
    homeassistant: {{ .Values.zigbeeConfig.homeassistant }}
    mqtt:
      base_topic: zigbee2mqtt
      include_device_information: true
      server: mqtt://{{ .Values.mqtt.server }}
    permit_join: {{ .Values.zigbeeConfig.permit_join }}
    serial:
      adapter: {{ .Values.zigbeeConfig.serial.adapter }}
      port: {{ .Values.zigbeeConfig.serial.port }}