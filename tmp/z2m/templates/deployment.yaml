apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-zigbee2mqtt-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zigbee2mqtt
  template:
    metadata:
      labels:
        app: zigbee2mqtt
    spec:
      containers:
      - name: zigbee2mqtt-container
        image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
        ports:
        - containerPort: {{ .Values.service.port }}
        env:
        - name: TZ
          value: {{ .Values.timezone }}
        volumeMounts:
        - name: data-volume
          mountPath: /data
        - name: udev-volume
          mountPath: /run/udev
          readOnly: true
        - name: zigbee-device
          mountPath: {{ .Values.zigbeeDevice.hostPath }}
        - name: zigbee2mqtt-settings
          mountPath: /app/configuration.yaml
          subPath: configuration.yaml
      volumes:
      - name: data-volume
        hostPath:
          path: {{ .Values.dataVolume.hostPath }}
      - name: udev-volume
        hostPath:
          path: /run/udev
      - name: zigbee-device
        hostPath:
          path: {{ .Values.zigbeeDevice.hostPath }}
      - configMap:
          defaultMode: 420
          name: zigbee2mqtt-settings
        name: zigbee2mqtt-settings
